# =====================================================================
#  local.conf — настройки сборки car-panel-OS
#  BitBake читает этот файл при каждой сборке.
#  Шаблон лежит в git: car-panel-OS/configs/local.conf
# =====================================================================


# ---------------------------------------------------------------------
# 1. ЦЕЛЬ СБОРКИ: под какое железо и какой дистрибутив
# ---------------------------------------------------------------------

# Плата. BitBake найдёт conf/machine/raspberrypi4-64.conf в meta-raspberrypi.
# Оттуда берутся архитектура CPU, ядро, device tree, загрузчик.
MACHINE = "raspberrypi4-64"

# Политика дистрибутива. BitBake найдёт conf/distro/carpanel.conf в meta-carpanel.
# Оттуда берутся init-система, DISTRO_FEATURES (wayland, opengl...) и т.д.
DISTRO = "carpanel"


# ---------------------------------------------------------------------
# 2. ОТЛАДКА: удобства для разработки, в релиз не идут
# ---------------------------------------------------------------------

# ssh-server-openssh — SSH-сервер в образе
# debug-tweaks       — вход root без пароля
EXTRA_IMAGE_FEATURES += "ssh-server-openssh debug-tweaks"


# ---------------------------------------------------------------------
# 3. ПОВЕДЕНИЕ BITBAKE
# ---------------------------------------------------------------------

# Собирать статистику времени по каждой задаче в tmp/buildstats/
USER_CLASSES ?= "buildstats"

# Если патч не наложился — просто упасть с ошибкой (не открывать shell)
PATCHRESOLVE = "noop"

# Защита от переполнения диска.
# Формат: ДЕЙСТВИЕ,ПАПКА,мин_свободного_места,мин_inodes
#   STOPTASKS — не запускать новые задачи, доделать текущие
#   HALT      — остановить сборку немедленно
BB_DISKMON_DIRS ??= "\
    STOPTASKS,${TMPDIR},1G,100K \
    STOPTASKS,${DL_DIR},1G,100K \
    STOPTASKS,${SSTATE_DIR},1G,100K \
    STOPTASKS,/tmp,100M,100K \
    HALT,${TMPDIR},100M,1K \
    HALT,${DL_DIR},100M,1K \
    HALT,${SSTATE_DIR},100M,1K \
    HALT,/tmp,10M,1K"


# ---------------------------------------------------------------------
# 4. ДИСПЛЕЙ: Waveshare RGB LCD HAT + EP1103J-55-DCT 10.1" 1024x600
#    (по-хорошему должно жить в meta-carpanel — перенесём позже)
# ---------------------------------------------------------------------

# Строки, которые дописываются в config.txt на boot-разделе SD-карты.
RPI_EXTRA_CONFIG = '\n\
# Waveshare RGB LCD HAT + EP1103J-55-DCT 10.1 inch 1024x600 \n\
dtoverlay=vc4-kms-dpi-generic,rgb666 \n\
dtparam=clock-frequency=51206400 \n\
dtparam=hactive=1024,hfp=160,hsync=20,hbp=140 \n\
dtparam=vactive=600,vfp=12,vsync=3,vbp=20 \n\
dtparam=width-mm=223,height-mm=125 \n\
disable_fw_kms_setup=1 \n\
'

# Положить файл overlay на boot-раздел.
# Без этого строка dtoverlay= выше ничего не сделает.
RPI_KERNEL_DEVICETREE_OVERLAYS:append = " overlays/vc4-kms-dpi-generic.dtbo"


# ---------------------------------------------------------------------
# 5. СЛУЖЕБНОЕ: не трогать
# ---------------------------------------------------------------------

# Версия формата этого файла
CONF_VERSION = "2"
