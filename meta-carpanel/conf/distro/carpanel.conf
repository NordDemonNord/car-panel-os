require conf/distro/poky.conf

DISTRO = "carpanel"
DISTRO_NAME = "CarPanel OS"
DISTRO_VERSION = "1.0"
DISTRO_CODENAME = "scarthgap"
MAINTAINER = "Nord <nord@example.com>"

SDK_VENDOR = "-carpanelsdk"
TARGET_VENDOR = "-carpanel"

# Graphics stack: KMS/DRM + EGLFS only.
# No windowing system - Qt talks to /dev/dri directly.
POKY_DEFAULT_DISTRO_FEATURES = "opengl"

# Trimmed from oe-core defaults: no x11, nfc, 3g, pcmcia, nfs, zeroconf.
DISTRO_FEATURES_DEFAULT = "acl alsa ext2 ipv4 ipv6 pci seccomp usbgadget usbhost vfat xattr"

# systemd - the automotive standard (AGL, COVESA).
POKY_INIT_MANAGER = "systemd"
